<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">

    <title>Elimina Volo - FlyHigh</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:Arial, Helvetica, sans-serif; }
        body { background:#0f172a; color:white; }
        header { position:absolute; top:0; width:100%; display:flex; justify-content:space-between; align-items:center; padding:25px 60px; z-index:10; }
        
        /* Stile Logo Link */
        .logo { font-size:28px; font-weight:bold; text-decoration: none; color: white; transition: 0.3s; }
        .logo:hover { color: #38bdf8; }

        nav { display:flex; gap:25px; }
        nav a { text-decoration:none; color:white; font-weight:500; transition:0.3s; }
        nav a:hover { color:#38bdf8; }
        .hero { min-height:100vh; background:url('https://images.unsplash.com/photo-1436491865332-7a61a109cc05?q=80&w=2074') center/cover; display:flex; justify-content:center; align-items:center; position:relative; padding:30px; }
        .overlay { position:absolute; inset:0; background:rgba(0,0,0,0.55); }
        .hero-content { position:relative; z-index:2; width:100%; max-width:1000px; text-align:center; }
        .hero h1 { font-size:55px; margin-bottom:15px; }
        .hero p { font-size:18px; opacity:0.9; margin-bottom:40px; }
        .search-box { background:rgba(255,255,255,0.1); backdrop-filter:blur(15px); padding:35px; border-radius:25px; box-shadow:0 10px 40px rgba(0,0,0,0.3); }
        .form-row { display:flex; gap:20px; margin-bottom:20px; flex-wrap:wrap; }
        .input-group { flex:1; display:flex; flex-direction:column; text-align:left; }
        .input-group label { margin-bottom:8px; font-weight:600; }
        .input-group input { padding:14px; border:none; border-radius:12px; background:white; font-size:15px; outline:none; color: #333; }
        .admin-buttons { margin-top:35px; display:flex; justify-content:center; gap:20px; flex-wrap:wrap; }
        .btn { text-decoration:none; color:white; padding:14px 22px; border-radius:12px; font-weight:bold; transition:0.3s; border:none; cursor:pointer; font-size:16px; }
        .red { background:#dc2626; }
        .gray { background: rgba(255,255,255,0.2); }
        .btn:hover { transform:translateY(-3px); opacity:0.9; }
        @media(max-width:768px){ .hero h1{ font-size:38px; } header{ padding:20px; } }
    </style>
</head>
<body>

    <header>
        <a href="homepage.html" class="logo">FlyHigh</a>
        <nav>
            <a href="homepage.html">Home</a>
            <a href="crea.html">Aggiungi</a>
            <a href="cancella.html">Elimina</a>
        </nav>

    <section class="hero">

        <div class="hero-content">
            <h1>Gestione Flotta</h1>
            <p>Inserisci l'ID del volo da rimuovere dal sistema.</p>

            <div class="search-box">
                <form action="elimina.php" method="POST">
                    <div class="form-row">
                        <div class="input-group">
                            <label>ID Identificativo Volo</label>
                            <input type="number" name="id_volo" placeholder="Inserisci l'ID numerico" required>

                    </div>

                    <p style="margin: 15px 0; color: #fca5a5; font-size: 14px;">
                        <strong>Attenzione:</strong> L'operazione eliminerà il record in modo permanente.
                    </p>

                    <div class="admin-buttons">
                        <button type="submit" class="btn red">Elimina Volo</button>
                        <a href="homepage.html" class="btn gray">Torna alla Home</a>
                    </div>
                </form>
            </div>
        </div>
    </section>

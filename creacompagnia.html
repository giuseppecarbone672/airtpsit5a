<html>

<head>
    <title>Crea Compagnia Aerea</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

<h1 class="counter">Crea Compagnia Aerea</h1>

<div class="card-container">

<form method="post"
action="creacompagnia.php"
class="search-form glass">

    <div class="form-actions">
        <label>Codice</label>
        <input type="text"
        name="codice"
        placeholder="ALITALIA"
        required>
    </div>

    <div class="form-actions">
        <label>Nome</label>
        <input type="text"
        name="nome"
        placeholder="Alitalia"
        required>
    </div>

    <div class="form-actions">
        <label>Immagine</label>
        <input type="text"
        name="immagine"
        placeholder="logo.png">
    </div>

    <div class="form-actions">
        <label>Capitale Sociale</label>
        <input type="number"
        step="0.01"
        name="capitale_sociale"
        placeholder="1000000"
        required>
    </div>

    <div class="form-actions buttons">
        <button type="submit">Crea</button>
        <button type="reset" class="reset">Reset</button>
    </div>

</form>

</div>

</body>

</html>
